---
layout: default
---
<div class="article-wrap">
    {% if page.toc %}
    {% include article-toc.html %}
    {% endif %}
    <article class="post">
        <h1>{{ page.title }}</h1>
        {% if page.date %}
        <div class="meta">
            {% include icon-calendar.html %}
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time>
        </div>
        {% else %}
        <div class="meta"></div>
        {% endif %}
        <div class="prose">
            {{ content }}
        </div>
    </article>
</div>
