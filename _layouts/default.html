<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="shortcut icon" href="/images/luli.png"/>
        <link rel="stylesheet" href="/css/site.css" type="text/css" />
        <title>{% if page.title and page.title != site.name %}{{ page.title }} - {% endif %}{{ site.name }}</title>
        {% if page.use_math %}
            {% include mathjax_support.html %}
        {% endif %}
    </head>
    <body>
        <header class="site-header">
            <div class="bar">
                <a class="site-brand" href="/">{{ site.name }}</a>
                {% assign nav = page.url | remove_first: "/" | split: "/" | first | remove: ".html" %}
                <nav class="site-nav">
                    <a href="/"{% unless nav == "notes" or nav == "about" %} class="active"{% endunless %}>博客</a>
                    <a href="/notes/"{% if nav == "notes" %} class="active"{% endif %}>手记</a>
                    <a href="/about"{% if nav == "about" %} class="active"{% endif %}>关于</a>
                </nav>
            </div>
        </header>
        <main>
            {{ content }}
        </main>
        <footer class="site-footer">© {{ site.time | date: "%Y" }} {{ site.name }}</footer>
    </body>
</html>
