<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">UDP 长度的三个统计范围</title>
  <desc id="desc">无 IP 选项的 IPv4 数据报总长上限是 65535 字节，去掉 20 字节 IP 首部和 8 字节 UDP 首部后，UDP 载荷上限是 65507 字节。路径 MTU 为 1500 时，免分片载荷上限是 1472 字节。</desc>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#243244}
    .title{font-size:26px;font-weight:700}.label{font-size:22px;font-weight:700}
    .note{font-size:19px;fill:#58677a}.number{font-size:26px;font-weight:700;fill:#245b8e}
  </style>
  <rect width="800" height="460" rx="16" fill="#fff"/>
  <text x="400" y="42" class="title" text-anchor="middle">同一份数据，长度从哪里开始算？</text>
  <text x="400" y="76" class="note" text-anchor="middle">以下均为无 IP 选项、20 字节首部的 IPv4</text>
  <path d="M30 121 V108 H770 V121" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="101" class="label" text-anchor="middle">IPv4 数据报总长 ≤ 65535 字节</text>
  <rect x="30" y="134" width="160" height="89" rx="8" fill="#eef2f7" stroke="#aab8c9"/>
  <rect x="198" y="134" width="164" height="89" rx="8" fill="#eaf2fb" stroke="#a9c3df"/>
  <rect x="370" y="134" width="400" height="89" rx="8" fill="#edf6ef" stroke="#a6c9b1"/>
  <text x="110" y="172" class="label" text-anchor="middle">IPv4 首部</text>
  <text x="110" y="203" class="note" text-anchor="middle">20 字节</text>
  <text x="280" y="172" class="label" text-anchor="middle">UDP 首部</text>
  <text x="280" y="203" class="note" text-anchor="middle">8 字节</text>
  <text x="570" y="172" class="label" text-anchor="middle">UDP 载荷 ≤ 65507 字节</text>
  <text x="570" y="203" class="note" text-anchor="middle">应用传入 SendTo 的数据</text>
  <path d="M198 237 V250 H770 V237" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="484" y="280" class="label" text-anchor="middle">UDP 数据报总长 ≤ 65515 字节</text>
  <rect x="30" y="310" width="740" height="119" rx="12" fill="#f7fafc" stroke="#d3dfec"/>
  <text x="400" y="345" class="label" text-anchor="middle">如果路径 MTU = 1500 字节，还要考虑免分片预算</text>
  <text x="400" y="386" class="number" text-anchor="middle">1500 − 20 − 8 = 1472 字节</text>
  <text x="400" y="415" class="note" text-anchor="middle">1472 限制免分片载荷；65507 限制协议允许的载荷。</text>
</svg>
