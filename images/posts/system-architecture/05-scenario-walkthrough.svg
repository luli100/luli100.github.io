<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 522" role="img" aria-labelledby="title desc">
<title id="title">把场景放到架构上走一遍</title><desc id="desc">采集进程崩溃场景依次经过崩溃、主界面进程靠心跳发现、重启恢复和离线善后，每一步对应构件、机制和时间。</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#806a4d"/></marker></defs>
<style>
text {font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#27342f}
.title {font-weight:700} .muted {fill:#61695f} .emphasis {fill:#7b522c;font-weight:700}
.box {fill:#fff;stroke:#aeb9ad;stroke-width:1.8}
.soft {fill:#eef2e9;stroke:#aeb9ad;stroke-width:1.8}
.warning {fill:#fbefdf;stroke:#c3a078;stroke-width:1.8}
.boundary {fill:#f1f2ed;stroke:#bbc4b6;stroke-width:1.6;stroke-dasharray:6 5}
.arrow,.line {fill:none;stroke:#806a4d;stroke-width:2.2;stroke-linejoin:round}
.faint {stroke:#d4dbce;stroke-width:1.4}
</style>
<rect width="600" height="522" rx="10" fill="#f8f8f3"/>
<text x="28" y="38" font-size="23" text-anchor="start" class="title"><tspan x="28" dy="0">把场景放到架构上走一遍</tspan></text>
<text x="28" y="80" font-size="20" text-anchor="start" class="muted"><tspan x="28" dy="0">场景：某一路采集进程崩溃，要尽快恢复采集</tspan></text><rect x="28" y="104" width="86" height="64" rx="7" class="warning"/><text x="71.0" y="143.14" font-size="21" text-anchor="middle" class=""><tspan x="71.0" dy="0">崩溃</tspan></text><rect x="124" y="104" width="340" height="64" rx="7" class="box"/><text x="294.0" y="129.16" font-size="19" text-anchor="middle" class=""><tspan x="294.0" dy="0">这一路采集进程</tspan><tspan x="294.0" dy="26.599999999999998">其余四路照常采</tspan></text><text x="530" y="143" font-size="21" text-anchor="middle" class="emphasis"><tspan x="530" dy="0">0</tspan></text><polyline points="71,172 71,192" class="arrow" marker-end="url(#tip)"/><rect x="28" y="196" width="86" height="64" rx="7" class="soft"/><text x="71.0" y="235.14" font-size="21" text-anchor="middle" class=""><tspan x="71.0" dy="0">发现</tspan></text><rect x="124" y="196" width="340" height="64" rx="7" class="box"/><text x="294.0" y="221.16" font-size="19" text-anchor="middle" class=""><tspan x="294.0" dy="0">主界面进程</tspan><tspan x="294.0" dy="26.599999999999998">连续 3 次收不到上报</tspan></text><text x="530" y="235" font-size="21" text-anchor="middle" class="emphasis"><tspan x="530" dy="0">约 3 秒</tspan></text><polyline points="71,264 71,284" class="arrow" marker-end="url(#tip)"/><rect x="28" y="288" width="86" height="64" rx="7" class="soft"/><text x="71.0" y="327.14" font-size="21" text-anchor="middle" class=""><tspan x="71.0" dy="0">恢复</tspan></text><rect x="124" y="288" width="340" height="64" rx="7" class="box"/><text x="294.0" y="313.15999999999997" font-size="19" text-anchor="middle" class=""><tspan x="294.0" dy="0">主界面进程</tspan><tspan x="294.0" dy="26.599999999999998">重启采集进程，续写文件</tspan></text><text x="530" y="327" font-size="21" text-anchor="middle" class="emphasis"><tspan x="530" dy="0">N 秒</tspan></text><polyline points="71,356 71,376" class="arrow" marker-end="url(#tip)"/><rect x="28" y="380" width="86" height="64" rx="7" class="soft"/><text x="71.0" y="419.14" font-size="21" text-anchor="middle" class=""><tspan x="71.0" dy="0">善后</tspan></text><rect x="124" y="380" width="340" height="64" rx="7" class="box"/><text x="294.0" y="405.15999999999997" font-size="19" text-anchor="middle" class=""><tspan x="294.0" dy="0">离线后处理</tspan><tspan x="294.0" dy="26.599999999999998">丢弃不完整的帧</tspan></text><text x="530" y="419" font-size="21" text-anchor="middle" class="emphasis"><tspan x="530" dy="0">离线</tspan></text><text x="28" y="494" font-size="21" text-anchor="start" class="emphasis"><tspan x="28" dy="0">这一路大约缺 3 + N 秒数据；N 需要实测</tspan></text>
</svg>