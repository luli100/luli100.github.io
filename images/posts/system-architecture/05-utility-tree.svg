line points="120,238 146,314" class="arrow" marker-end="url(#tip)"/><polyline points="258,314 282,314" class="arrow" marker-end="url(#tip)"/><rect x="286" y="290" width="230" height="48" rx="7" class="warning"/><text x="401.0" y="320.12" font-size="18" text-anchor="middle" class=""><tspan x="401.0" dy="0">未拷走的数据被误删</tspan></text><text x="556" y="321" font-size="18" text-anchor="middle" class="emphasis"><tspan x="556" dy="0">H, L</tspan></text><rect x="150" y="374" width="104" height="48" rx="7" class="box"/><text x="202.0" y="404.46" font-size="19" text-anchor="middle" class=""><tspan x="202.0" dy="0">可修改性</tspan></text><polyline points="120,238 146,398" class="arrow" marker-end="url(#tip)"/><polyline points="258,398 282,398" class="arrow" marker-end="url(#tip)"/><rect x="286" y="374" width="230" height="48" rx="7" class="box"/><text x="401.0" y="404.12" font-size="18" text-anchor="middle" class=""><tspan x="401.0" dy="0">换一种采集卡</tspan></text><text x="28" y="460" font-size="18" text-anchor="start" class="muted"><tspan x="28" dy="0">叶子标（重要性，实现难度）；配色这类场景在修剪时剪掉</tspan></text>
