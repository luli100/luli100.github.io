<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title desc">
<title id="title">缓存改变查询路径，也增加更新责任</title><desc id="desc">直接查询与缓存查询的关系比较。</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#806a4d"/></marker></defs>
<style>
text {font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#27342f}
.title {font-weight:700} .muted {fill:#61695f} .emphasis {fill:#7b522c;font-weight:700}
.box {fill:#fff;stroke:#aeb9ad;stroke-width:1.8}
.soft {fill:#eef2e9;stroke:#aeb9ad;stroke-width:1.8}
.warning {fill:#fbefdf;stroke:#c3a078;stroke-width:1.8}
.boundary {fill:#f1f2ed;stroke:#bbc4b6;stroke-width:1.6;stroke-dasharray:6 5}
.arrow,.line {fill:none;stroke:#806a4d;stroke-width:2.2;stroke-linejoin:round}
.faint {stroke:#d4dbce;stroke-width:1.4}
</style>
<rect width="600" height="410" rx="10" fill="#f8f8f3"/>
<text x="28" y="38" font-size="23" text-anchor="start" class="title"><tspan x="28" dy="0">缓存改变查询路径，也增加更新责任</tspan></text>
<text x="28" y="80" font-size="20" text-anchor="start" class="muted"><tspan x="28" dy="0">原来</tspan></text><rect x="28" y="100" width="170" height="62" rx="7" class="box"/><text x="113.0" y="138.48" font-size="22" text-anchor="middle" class=""><tspan x="113.0" dy="0">查询请求</tspan></text><rect x="380" y="100" width="190" height="62" rx="7" class="box"/><text x="475.0" y="138.48" font-size="22" text-anchor="middle" class=""><tspan x="475.0" dy="0">数据源</tspan></text><polyline points="202,131 372,131" class="arrow" marker-end="url(#tip)"/><text x="287" y="115" font-size="20" text-anchor="middle" class=""><tspan x="287" dy="0">每次回源</tspan></text><text x="28" y="214" font-size="20" text-anchor="start" class="muted"><tspan x="28" dy="0">加入缓存以后</tspan></text><rect x="28" y="242" width="124" height="62" rx="7" class="box"/><text x="90.0" y="280.48" font-size="22" text-anchor="middle" class=""><tspan x="90.0" dy="0">查询请求</tspan></text><rect x="236" y="242" width="128" height="62" rx="7" class="soft"/><text x="300.0" y="280.48" font-size="22" text-anchor="middle" class=""><tspan x="300.0" dy="0">缓存</tspan></text><rect x="448" y="242" width="124" height="62" rx="7" class="box"/><text x="510.0" y="280.48" font-size="22" text-anchor="middle" class=""><tspan x="510.0" dy="0">数据源</tspan></text><polyline points="158,273 228,273" class="arrow" marker-end="url(#tip)"/><text x="193" y="257" font-size="19" text-anchor="middle" class=""><tspan x="193" dy="0">先查</tspan></text><polyline points="370,273 440,273" class="arrow" marker-end="url(#tip)"/><text x="405" y="257" font-size="19" text-anchor="middle" class=""><tspan x="405" dy="0">未命中</tspan></text><polyline points="510,309 510,340 300,340 300,310" class="arrow" marker-end="url(#tip)" stroke-dasharray="6 5"/><text x="300" y="382" font-size="21" text-anchor="middle" class="emphasis"><tspan x="300" dy="0">写入后，缓存需要失效或更新</tspan></text>
</svg>