<rect x="24" y="78" width="140" height="78" rx="7" class="box"/><text x="94.0" y="109.08" font-size="22" text-anchor="middle" class=""><tspan x="94.0" dy="0">输入</tspan><tspan x="94.0" dy="30.799999999999997">26 MB/s</tspan></text><rect x="230" y="78" width="140" height="78" rx="7" class="soft"/><text x="300.0" y="109.08" font-size="22" text-anchor="middle" class=""><tspan x="300.0" dy="0">缓冲</tspan><tspan x="300.0" dy="30.799999999999997">64 MB</tspan></text><rect x="436" y="78" width="140" height="78" rx="7" class="box"/><text x="506.0" y="109.08" font-size="22" text-anchor="middle" class=""><tspan x="506.0" dy="0">消费</tspan><tspan x="506.0" dy="30.799999999999997">μ MB/s</tspan></text><polyline points="170,117 222,117" class="arrow" marker-end="url(#tip)"/><polyline points="376,117 428,117" class="arrow" marker-end="url(#tip)"/><line x1="28" y1="192" x2="572" y2="192" class="faint"/><text x="30" y="233" font-size="22" text-anchor="start" class=""><tspan x="30" dy="0">暂停消费：μ = 0</tspan></text><text x="300" y="281" font-size="30" text-anchor="middle" class="emphasis"><tspan x="300" dy="0">64 ÷ 26 ≈ 2.46 秒</tspan></text><line x1="28" y1="315" x2="572" y2="315" class="faint"/><text x="30" y="355" font-size="22" text-anchor="start" class=""><tspan x="30" dy="0">持续过载：μ = 25 MB/s</tspan></text><text x="300" y="404" font-size="25" text-anchor="middle" class="emphasis"><tspan x="300" dy="0">每秒积压 1 MB，约 64 秒填满</tspan></text><text x="300" y="448" font-size="18" text-anchor="middle" class="muted"><tspan x="300" dy="0">理想预算：初始为空，未计额外开销</tspan></text>
