<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">故障次数和不可用时间，是两笔账</title><desc id="desc">甲频繁短中断，乙少量长中断；应分别评价连续工作能力和可用时间。</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#806a4d"/></marker></defs>
<style>
text {font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#27342f}
.title {font-weight:700} .muted {fill:#61695f} .emphasis {fill:#7b522c;font-weight:700}
.box {fill:#fff;stroke:#aeb9ad;stroke-width:1.8}
.soft {fill:#eef2e9;stroke:#aeb9ad;stroke-width:1.8}
.warning {fill:#fbefdf;stroke:#c3a078;stroke-width:1.8}
.boundary {fill:#f1f2ed;stroke:#bbc4b6;stroke-width:1.6;stroke-dasharray:6 5}
.arrow,.line {fill:none;stroke:#806a4d;stroke-width:2.2;stroke-linejoin:round}
.faint {stroke:#d4dbce;stroke-width:1.4}
</style>
<rect width="600" height="360" rx="10" fill="#f8f8f3"/>
<text x="28" y="38" font-size="23" text-anchor="start" class="title"><tspan x="28" dy="0">故障次数和不可用时间，是两笔账</tspan></text>
<text x="30" y="90" font-size="21" text-anchor="start" class=""><tspan x="30" dy="0">服务甲：每天10次，每次中断1秒</tspan></text><line x1="35" y1="127" x2="565" y2="127" class="line"/><rect x="90" y="116" width="6" height="22" fill="#bc8b64"/><rect x="136" y="116" width="6" height="22" fill="#bc8b64"/><rect x="182" y="116" width="6" height="22" fill="#bc8b64"/><rect x="228" y="116" width="6" height="22" fill="#bc8b64"/><rect x="274" y="116" width="6" height="22" fill="#bc8b64"/><rect x="320" y="116" width="6" height="22" fill="#bc8b64"/><rect x="366" y="116" width="6" height="22" fill="#bc8b64"/><rect x="412" y="116" width="6" height="22" fill="#bc8b64"/><rect x="458" y="116" width="6" height="22" fill="#bc8b64"/><rect x="504" y="116" width="6" height="22" fill="#bc8b64"/><text x="30" y="173" font-size="22" text-anchor="start" class="emphasis"><tspan x="30" dy="0">全年中断 3,650 秒，约 1 小时</tspan></text><text x="30" y="233" font-size="21" text-anchor="start" class=""><tspan x="30" dy="0">服务乙：每年1次，中断48小时</tspan></text><line x1="35" y1="268" x2="565" y2="268" class="line"/><rect x="288" y="257" width="85" height="22" fill="#bc8b64"/><text x="30" y="311" font-size="22" text-anchor="start" class="emphasis"><tspan x="30" dy="0">故障更少，不等于不可用时间更短</tspan></text><text x="30" y="344" font-size="18" text-anchor="start" class="muted"><tspan x="30" dy="0">标记用于说明差别，不按时间比例绘制</tspan></text>
</svg>