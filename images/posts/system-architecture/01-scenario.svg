<text x="28" y="38" font-size="23" text-anchor="start" class="title"><tspan x="28" dy="0">把“高可用”写成具体场景</tspan></text>
<rect x="18" y="66" width="564" height="264" rx="7" class="boundary"/><text x="300.0" y="205.48" font-size="22" text-anchor="middle" class=""><tspan x="300.0" dy="0"></tspan></text><text x="36" y="96" font-size="21" text-anchor="start" class="muted"><tspan x="36" dy="0">环境：系统正常运行时</tspan></text><rect x="34" y="121" width="224" height="68" rx="7" class="box"/><text x="146.0" y="147.07999999999998" font-size="22" text-anchor="middle" class=""><tspan x="146.0" dy="0">刺激源</tspan><tspan x="146.0" dy="30.799999999999997">运维人员</tspan></text><rect x="342" y="121" width="224" height="68" rx="7" class="box"/><text x="454.0" y="147.07999999999998" font-size="22" text-anchor="middle" class=""><tspan x="454.0" dy="0">刺激</tspan><tspan x="454.0" dy="30.799999999999997">误删数据库</tspan></text><polyline points="264,155 334,155" class="arrow" marker-end="url(#tip)"/><rect x="34" y="235" width="224" height="68" rx="7" class="box"/><text x="146.0" y="261.08" font-size="22" text-anchor="middle" class=""><tspan x="146.0" dy="0">制品</tspan><tspan x="146.0" dy="30.799999999999997">业务数据库</tspan></text><rect x="342" y="235" width="224" height="68" rx="7" class="box"/><text x="454.0" y="261.08" font-size="22" text-anchor="middle" class=""><tspan x="454.0" dy="0">响应</tspan><tspan x="454.0" dy="30.799999999999997">发现、告警并恢复</tspan></text><polyline points="454,194 454,211 146,211 146,229" class="arrow" marker-end="url(#tip)"/><polyline points="264,269 334,269" class="arrow" marker-end="url(#tip)"/><rect x="30" y="363" width="540" height="75" rx="7" class="soft"/><text x="300.0" y="392.94" font-size="21" text-anchor="middle" class=""><tspan x="300.0" dy="0">响应度量（示例）</tspan><tspan x="300.0" dy="29.4">2小时内恢复；丢失窗口不超过5分钟</tspan></text>
