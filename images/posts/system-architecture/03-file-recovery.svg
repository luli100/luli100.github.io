<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">写到一半的文件，怎样重新读？</title><desc id="desc">完整记录后出现不完整尾部；恢复依据是格式约定和有效边界。</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#806a4d"/></marker></defs>
<style>
text {font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#27342f}
.title {font-weight:700} .muted {fill:#61695f} .emphasis {fill:#7b522c;font-weight:700}
.box {fill:#fff;stroke:#aeb9ad;stroke-width:1.8}
.soft {fill:#eef2e9;stroke:#aeb9ad;stroke-width:1.8}
.warning {fill:#fbefdf;stroke:#c3a078;stroke-width:1.8}
.boundary {fill:#f1f2ed;stroke:#bbc4b6;stroke-width:1.6;stroke-dasharray:6 5}
.arrow,.line {fill:none;stroke:#806a4d;stroke-width:2.2;stroke-linejoin:round}
.faint {stroke:#d4dbce;stroke-width:1.4}
</style>
<rect width="600" height="400" rx="10" fill="#f8f8f3"/>
<text x="28" y="38" font-size="23" text-anchor="start" class="title"><tspan x="28" dy="0">写到一半的文件，怎样重新读？</tspan></text>
<rect x="24" y="100" width="122" height="82" rx="7" class="soft"/><text x="85.0" y="133.07999999999998" font-size="22" text-anchor="middle" class=""><tspan x="85.0" dy="0">完整</tspan><tspan x="85.0" dy="30.799999999999997">记录1</tspan></text><rect x="168" y="100" width="122" height="82" rx="7" class="soft"/><text x="229.0" y="133.07999999999998" font-size="22" text-anchor="middle" class=""><tspan x="229.0" dy="0">完整</tspan><tspan x="229.0" dy="30.799999999999997">记录2</tspan></text><rect x="312" y="100" width="122" height="82" rx="7" class="soft"/><text x="373.0" y="133.07999999999998" font-size="22" text-anchor="middle" class=""><tspan x="373.0" dy="0">完整</tspan><tspan x="373.0" dy="30.799999999999997">记录3</tspan></text><rect x="456" y="100" width="120" height="82" rx="7" class="warning"/><text x="516.0" y="133.07999999999998" font-size="22" text-anchor="middle" class=""><tspan x="516.0" dy="0">不完整</tspan><tspan x="516.0" dy="30.799999999999997">尾部</tspan></text><text x="300" y="226" font-size="22" text-anchor="middle" class=""><tspan x="300" dy="0">依据：边界、长度、序号、校验</tspan></text><polyline points="516,190 516,256" class="arrow" marker-end="url(#tip)"/><rect x="24" y="263" width="552" height="66" rx="7" class="box"/><text x="300.0" y="303.14" font-size="21" text-anchor="middle" class=""><tspan x="300.0" dy="0">识别缺失；截断、跳过或标记损坏部分</tspan></text><text x="300" y="372" font-size="20" text-anchor="middle" class="emphasis"><tspan x="300" dy="0">处理规则和持久性保证，需要故障测试证明</tspan></text>
</svg>