<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="title desc">
<title id="title">UDP 数据路径中的不同缓冲区</title>
<desc id="desc">应用、操作系统队列与网卡内部资源处在不同位置；PAUSE 是网卡之间的独立反馈。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45345"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#243244} .small{font-size:17px;fill:#58677a}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.note{font-size:20px;fill:#58677a}</style>
<rect width="800" height="660" rx="16" fill="#fff"/>
<text x="400" y="43" class="title" text-anchor="middle">先分清：哪个缓冲区满了？</text>
<rect x="28" y="76" width="342" height="488" rx="12" fill="#f7fafc" stroke="#d3dfec" stroke-width="1.5"/>
<rect x="430" y="76" width="342" height="488" rx="12" fill="#fdfaf5" stroke="#e9d8c0" stroke-width="1.5"/>
<text x="199" y="108" class="label" text-anchor="middle">发送端</text>
<text x="601" y="108" class="label" text-anchor="middle">接收端</text>
<rect x="53" y="132" width="292" height="76" rx="12" fill="#eaf2fb" stroke="#a9c3df" stroke-width="1.5"/>
<text x="199" y="164" class="label" text-anchor="middle">发送程序</text>
<text x="199" y="191" class="small" text-anchor="middle">持续产生报文</text>
<rect x="53" y="260" width="292" height="76" rx="12" fill="#eaf2fb" stroke="#a9c3df" stroke-width="1.5"/>
<text x="199" y="292" class="label" text-anchor="middle">本机发送资源</text>
<text x="199" y="319" class="small" text-anchor="middle">Socket / 驱动队列等</text>
<rect x="53" y="388" width="292" height="76" rx="12" fill="#eaf2fb" stroke="#a9c3df" stroke-width="1.5"/>
<text x="199" y="420" class="label" text-anchor="middle">发送端 MAC</text>
<text x="199" y="447" class="small" text-anchor="middle">实际向网口发出数据</text>
<rect x="455" y="132" width="292" height="76" rx="12" fill="#fbf0df" stroke="#d8bd97" stroke-width="1.5"/>
<text x="601" y="164" class="label" text-anchor="middle">接收应用</text>
<text x="601" y="191" class="small" text-anchor="middle">Receive / 业务处理</text>
<rect x="455" y="260" width="292" height="76" rx="12" fill="#fbf0df" stroke="#d8bd97" stroke-width="1.5"/>
<text x="601" y="292" class="label" text-anchor="middle">UDP 接收队列</text>
<text x="601" y="319" class="small" text-anchor="middle">满时通常丢弃报文</text>
<rect x="455" y="388" width="292" height="76" rx="12" fill="#fbf0df" stroke="#d8bd97" stroke-width="1.5"/>
<text x="601" y="420" class="label" text-anchor="middle">接收端 MAC</text>
<text x="601" y="447" class="small" text-anchor="middle">收包后交给协议栈</text>
<path d="M199,211 L199,251" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M199,339 L199,379" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M601,259 L601,217" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M601,387 L601,345" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="653" y="240" class="small" text-anchor="start">读取</text>
<text x="653" y="368" class="small" text-anchor="start">分发</text>
<path d="M347,426 L452,426" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400" y="411" class="small" text-anchor="middle">数据</text>
<path d="M455,452 L411,452 L411,504 L389,504 L389,452 L346,452" fill="none" stroke="#b45345" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#red-arrow)"/>
<text x="400" y="539" class="note" text-anchor="middle">PAUSE：独立的链路层反馈，需支持并启用</text>
<text x="400" y="605" class="label" text-anchor="middle">应用读取慢 → UDP 接收队列积压 → 通常本机丢包</text>
<text x="400" y="640" class="note" text-anchor="middle">不能仅凭应用读得慢，推断网卡已经发出 PAUSE。</text>
</svg>
