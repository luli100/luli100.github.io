      text { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 17px; fill: #303a29; }
      .var { font-family: 'Times New Roman', 'Cambria Math', serif; font-style: italic; }
      .tick { font-size: 15px; fill: #56634e; }
      .ok { fill: #3f7a3a; font-weight: 600; }
      .warn { fill: #b5523b; }
      .grid { stroke: #e3e8dc; stroke-width: 1; }
      .axis { stroke: #8a9a7c; stroke-width: 1.5; }
      .base { stroke: #8a9a7c; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .curve { fill: none; stroke: #587044; stroke-width: 3; }
      .dot { fill: #fff; stroke: #587044; stroke-width: 2.5; }
      .dot-ok { fill: #3f7a3a; }
      .dot-warn { fill: #b5523b; }
    </style>
  </defs>
