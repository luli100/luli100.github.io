<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">融合后的方差随 K 的变化</title>
  <desc id="desc">P预测为 1、R 为 4 时，融合后的方差随 K 先下降后上升。K 为 0 时方差为 1，即只用预测；K 为 0.2 时最低，方差为 0.8；K 为 0.5 即取平均时方差为 1.25，比只用预测还大；K 为 1 时方差为 4，即只用测量。</desc>
